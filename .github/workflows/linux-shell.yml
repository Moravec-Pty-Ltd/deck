# Builds the Linux desktop shell (apps/linux) as an AppImage, a deb, and a
# tarball of the bare binary that runs on the system's WebKitGTK. A run
# from the Actions tab keeps them as artifacts; pushing a linux-v* tag on a
# commit of main also publishes a release, whose latest.json is what the
# AppImage's updater reads. Only that release job sees the signing key or may
# write to the repository.
name: Linux shell

on:
  workflow_dispatch:
  push:
    tags: ['linux-v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check the tag
        if: startsWith(github.ref, 'refs/tags/linux-v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(jq -r .version tauri.conf.json)
          [ "$TAG" = "linux-v$version" ] || { echo "tag $TAG does not match the tauri.conf.json version $version"; exit 1; }
          git fetch -q origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || { echo "$TAG is not on main"; exit 1; }

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pulseaudio

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/linux

      - run: cargo test --locked

      # Unsigned: the release job signs what this one built.
      - name: Build
        run: npx --yes @tauri-apps/cli@2.12.5 build --bundles appimage deb --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Tarball
        run: |
          mkdir -p target/tarball/deck
          cp target/release/deck tarball/deck.desktop target/tarball/deck/
          cp icons/128x128.png target/tarball/deck/deck.png
          tar -czf target/release/bundle/deck-linux-x86_64.tar.gz -C target/tarball deck

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deck-linux
          path: |
            apps/linux/target/release/bundle/appimage/*.AppImage
            apps/linux/target/release/bundle/deb/*.deb
            apps/linux/target/release/bundle/deck-linux-x86_64.tar.gz

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/linux-v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deck-linux
          path: bundle

      - name: Sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "a release needs the TAURI_SIGNING_PRIVATE_KEY secret"; exit 1; }
          npx --yes @tauri-apps/cli@2.12.5 signer sign bundle/appimage/*.AppImage > /dev/null

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#linux-v}
          image=$(ls bundle/appimage/*.AppImage)
          name=$(basename "$image")
          jq -n \
            --arg version "$version" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sig "$(cat "$image.sig")" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/$TAG/$name" \
            '{version: $version, pub_date: $date, platforms: {"linux-x86_64": {signature: $sig, url: $url}}}' > latest.json
          gh release create "$TAG" --repo "${{ github.repository }}" --verify-tag --latest --title "deck for Linux ${TAG#linux-v}" --notes "AppImage (updates itself), deb, and deck-linux-x86_64.tar.gz (runs on your system's WebKitGTK; update it by hand)." \
            "$image" "$image.sig" bundle/deb/*.deb bundle/deck-linux-x86_64.tar.gz latest.json
